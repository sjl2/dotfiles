# Use backtick as the prefix
# Do it just like this or you will not
# be able to use type backtick literally
unbind C-b
set -g prefix `
bind ` send-prefix

# Make zsh the default shell for tmux
set -g default-shell /bin/zsh
set -g default-terminal "screen-256color"

# Start numbering at 1
set -g base-index 1

# Make mouse useful in copy mode
setw -g mouse on

# Scroll History
set -g history-limit 50000

# Set ability to capture on start and restore on exit window data when running an application
setw -g alternate-screen on

# Basically allows for faster key repetition
set -s escape-time 0

# Set status bar
set -g status-justify centre
set -g status-bg black
set -g status-fg white
set-option -g status-interval 5
set -g status-right-length 150
set -g status-left ""
set -g status-right '#{?pane_synchronized, #[bg=black]#[fg=blue]#[bg=blue]#[fg=black]  SYNC  #[bg=black]#[fg=blue]#[default] ,}'

# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size of any
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

# Allows us to use '<prefix>-a' <command> to send commands to a TMUX session inside
# another TMUX session
bind-key a send-prefix

# Highlight active window
#set-window-option -g window-status-current-bg green
#set-window-option -g window-status-current-fg black
set -g window-status-current-style bg=green,fg=black

# Window list: what Claude Code is doing, or where you are.
#
# Claude Code writes "<glyph> <topic>" into the pane title, e.g.
# "⠂ Filter Gmail for job emails" while working, "✳ ..." while idle. That gives
# us both the topic and the busy/idle state for free, so the only thing needing
# a hook is "blocked on a permission prompt" (see agents/claude/hooks/).
#
# These @_ options are format fragments, not settings; #{E:...} expands one as a
# format. Split up only for readability — inlined this is one 500-char line.

# Is Claude running anywhere in this window, and what is its pane title? #{P:...}
# loops over every pane rather than just the active one, so the topic survives
# splitting the window off to poke at files.
set -g @_cc_pane  '#{P:#{?#{==:#{pane_current_command},claude},Y,}}'
set -g @_cc_title '#{P:#{?#{==:#{pane_current_command},claude},#{pane_title},}}'
set -g @_cc_topic '#{P:#{?#{==:#{pane_current_command},claude},#{s/^[^ ]* //:pane_title},}}'

# Everything else: directory, plus the command when it isn't a plain shell.
set -g @_dir_cmd  '#{?#{m:*sh,#{pane_current_command}},#{b:pane_current_path},#{b:pane_current_path}·#{pane_current_command}}'

# ◐ working   ✓ idle   ! waiting on you
#
# The glyph is checked before @claude_attn so a stale flag can't stick: once
# Claude goes back to work the spinner wins and the '!' disappears on its own.
# That is why the hooks only need to clear it on turn end, not per tool call.
set -g @_cc_sym '#{?#{E:@_cc_pane},#{?#{m:✳*,#{E:@_cc_title}},#{?@claude_attn,! ,✓ },◐ },}'

# "Claude Code" is the placeholder title before a conversation is named; show
# dir·claude until the real topic lands, matching the non-Claude format.
set -g @_cc_name '#{?#{E:@_cc_pane},#{?#{==:#{E:@_cc_topic},Claude Code},#{b:pane_current_path}·claude,#{=/24/…:#{E:@_cc_topic}}},#{E:@_dir_cmd}}'

# `tmux rename-window foo` turns automatic-rename off for that window, so it
# doubles as "pin this tab" — worth doing when a window maps to one commit and
# you don't want Claude's topic drifting off it. `set -w automatic-rename on`
# resumes tracking. automatic-rename-format is deliberately left alone: renaming
# fires on pane events, while this is re-evaluated on every status redraw.
set -g window-status-format         '#I:#{E:@_cc_sym}#{?automatic-rename,#{E:@_cc_name},#W}#{?window_flags,#{window_flags}, }'
set -g window-status-current-format '#I:#{E:@_cc_sym}#{?automatic-rename,#{E:@_cc_name},#W}#{?window_flags,#{window_flags}, }'

# Turn on vi bindings in copy mode
set-option -g status-keys vi
set-window-option -g mode-keys vi

# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Bind ']' to use pbpaste
bind ] run "pbpaste | tmux load-buffer - && tmux paste-buffer"

# Resize with vim commands
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5

# Get notified when something happens inside other windows
setw -g monitor-activity on
set -g visual-activity on

# Move around panes vim style
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Start newly split panes in current panes current directory
bind 'v' split-window -h -c '#{pane_current_path}' # Split panes horizontal
bind 's' split-window -v -c '#{pane_current_path}' # Split panes vertically

# Bind m to synchronize panes
bind-key m set-window-option synchronize-panes

# Allow reordering of pane numbers
bind R move-window -r

# Reload Config File
bind r source-file ~/.tmux.conf

# Copy to OSX clipboard
bind-key y run-shell "tmux save-buffer - | pbcopy"
